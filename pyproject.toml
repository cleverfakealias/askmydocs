[project]
name = "palimpsest"
version = "2.0.0"
description = "Chat with your own documents using a local, key-free RAG pipeline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.6.7",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "torch>=2.14.1",
    "streamlit>=1.65.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "numpy>=2.5.3",
    "accelerate>=1.15.0",
]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22,<0.16",
    "pyright>=1.1.414",
]

[[tool.uv.index]]
# CUDA 13.0 build of PyTorch. Blackwell GPUs such as the RTX 5070 Ti need CUDA 12.8 or newer.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# macOS has no CUDA wheels, so it falls back to the default PyPI build (CPU and MPS).
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 99  # The upper limit that PEP 8 allows.
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "D",        # pydocstyle (PEP 257)
    "UP",       # pyupgrade: modern syntax for the target version
    "ANN",      # type annotations
    "B",        # bugbear
    "S",        # bandit security checks
    "SIM",      # simplifications
    "PTH",      # pathlib over os.path
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior, and pytest relies on bare asserts.
"tests/**" = ["D", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--tb=short"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
